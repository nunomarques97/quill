# Copy to local/bench.toml (ignored by Git) and replace the placeholders with
# absolute paths on this machine. Never commit real paths.
[paths]
# Folder with the valid takes (pt-NN.wav) and the recordings manifest.
recordings_dir = "/path/to/reference-project/recordings/pt"
# Markdown recording script with the expected text of each take.
recording_script = "/path/to/reference-project/recording-script.md"
# Reference project's local config.toml with the real project names.
reference_config = "/path/to/reference-project/config.toml"
# Optional: manifest path. Defaults to <recordings_dir>/manifesto.json.
# manifest = "/path/to/reference-project/recordings/pt/manifesto.json"

[dataset]
# Number of valid takes the benchmark requires.
expected_takes = 44

# Optional engine settings (defaults shown).
[engines.gemini]
# Free-tier Gemini model with audio input; change it when the free tier changes.
model = "gemini-2.5-flash"
# 0 turns thinking off; -1 omits thinkingConfig for models that reject it.
thinking_budget = 0

[engines.deepgram]
# Nova-3 Portuguese codes: pt, pt-BR, pt-PT.
language = "pt-PT"
# Vocabulary hints through keyterm prompting.
keyterm = true
