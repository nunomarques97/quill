# Copy to local/bench.toml (ignored by Git) and replace the placeholders with
# absolute paths on this machine. Never commit real paths.
[paths]
# Folder with the valid takes (pt-NN.wav) and the recordings manifest.
recordings_dir = "/path/to/reference-project/recordings/pt"
# Markdown recording script with the expected text of each take.
recording_script = "/path/to/reference-project/recording-script.md"
# Reference project's local config.toml with the real project names.
reference_config = "/path/to/reference-project/config.toml"
# Optional: manifest path. Defaults to <recordings_dir>/manifesto.json.
# manifest = "/path/to/reference-project/recordings/pt/manifesto.json"

[dataset]
# Number of valid takes the benchmark requires.
expected_takes = 44

# Optional: the Phase 2 dictation set (defaults shown). Its script is committed
# invented text; its recordings stay under the ignored local/ folder.
# [dictation]
# recordings_dir = "local/recordings/dictation"   # must be under local/
# recording_script = "bench/dictation/guiao-ditado-pt.md"
# id_prefix = "dt"
# expected_takes = 36
# min_takes = 30
#
# Optional: names shown for the <projeto-N> placeholders while recording.
# They must exist in the reference config. Without this table the mapping of
# the commands manifest ("projetos") is used.
# [dictation.projects]
# "<projeto-1>" = "first-project-name"
# "<projeto-2>" = "second-project-name"

# Optional: the command-mode set of spoken rewrite instructions (defaults
# shown), recorded with `bench.record --set rewrite`. Its script is committed
# invented text; its recordings stay under the ignored local/ folder.
# [rewrite]
# recordings_dir = "local/recordings/rewrite"   # must be under local/
# recording_script = "bench/dictation/guiao-reescrita-pt.md"
# id_prefix = "rw"
# expected_takes = 20
# min_takes = 16

# Optional: the voice-command set (defaults shown), recorded with
# `bench.record --set voice` and measured with `bench.voice_commands`. Its
# script is committed with <projeto-N> placeholders and invented names; its
# recordings stay under the ignored local/ folder.
# [voice]
# recordings_dir = "local/recordings/voice"   # must be under local/
# recording_script = "bench/dictation/guiao-comandos-pt.md"
# id_prefix = "vc"
# expected_takes = 15
# min_takes = 15
#
# Required to record the voice set: the project-hub shortcut name shown for
# each placeholder of the script. Each name must be a shortcut (.lnk file name
# without .lnk) in the [voice_commands] shortcut_dirs folders of
# local/quill.toml; these names, not the reference config, are the valid ones.
# The "irmão" rows need a name and its sibling (x and x-public).
# [voice.projects]
# "<projeto-1>" = "nimbus-deck"
# "<projeto-2>" = "orchard"
# "<projeto-3>" = "tidepool"
# "<projeto-4>" = "alfa"
# "<projeto-5>" = "alfa-public"
# "<projeto-6>" = "beacon"
# "<projeto-7>" = "beacon-public"
# "<projeto-8>" = "ledger-legal"
# "<projeto-9>" = "kite-radar"
# "<projeto-10>" = "quokkai"
# "<projeto-11>" = "marble"
# "<projeto-12>" = "harbor"
# "<projeto-13>" = "compass"

# Optional: the Claude Code prompts set (defaults shown), recorded with
# `bench.record --set prompts` and measured with `bench.prompts`. Its script
# is committed with <projeto-N> and <termo-N> placeholders and invented text;
# its recordings stay under the ignored local/ folder.
# [prompts]
# recordings_dir = "local/recordings/prompts"   # must be under local/
# recording_script = "bench/dictation/guiao-prompts-pt.md"
# id_prefix = "pp"
# expected_takes = 15
# min_takes = 15
#
# Required to record the prompts set: the project-hub shortcut name of each
# project placeholder (as for [voice.projects]: a name the project detection
# maps to a local folder) and the real domain term read for each term
# placeholder, a word of that project's own domain that its context pack
# lists (`bench.prompts --dry-run` counts the terms found in their pack).
# Both are flagged by the privacy guard in every committed file.
# [prompts.projects]
# "<projeto-1>" = "nimbus-deck"
# "<projeto-2>" = "orchard"
# "<projeto-3>" = "tidepool"
# "<projeto-4>" = "harbor"
# [prompts.terms]
# "<termo-1>" = "gridlock"
# "<termo-2>" = "quillmark"
# ... one line per <termo-N> of the script (15 terms)

# Optional: the answers to Claude Code messages (defaults shown), recorded
# with `bench.record --set replies` and measured with `bench.prompts`. Its
# script is committed with placeholders, invented text and a generic
# description of each Claude message. `bench.prompts` pairs a take with the
# plain-text reply file <take id>.md of replies_dir (any set's take may have
# one); the real Claude messages stay there, under the ignored local/ folder.
# The bench never reads Claude Code sessions.
# [replies]
# recordings_dir = "local/recordings/replies"   # must be under local/
# recording_script = "bench/dictation/guiao-respostas-pt.md"
# replies_dir = "local/replies"                 # must be under local/
# id_prefix = "rr"
# expected_takes = 10
# min_takes = 1
# [replies.projects]
# "<projeto-1>" = "nimbus-deck"
# "<projeto-2>" = "orchard"
# [replies.terms]
# "<termo-1>" = "gridlock"
# ... one line per <termo-N> of the script (8 terms)

# Optional: MME input device used by bench.record. A name truncated by MME to
# 31 characters still matches. Without it the reference config's microphone
# name ([microfone].nome) is used.
# [recorder]
# device = "Headset Microphone (Example Headset)"

# Optional engine settings (defaults shown).
[engines.gemini]
# Free-tier Gemini model with audio input; change it when the free tier changes.
# gemini-2.5-flash (the code default) is no longer offered to new API keys
# (HTTP 404, 2026-09-28); the benchmark used the dedicated speech-to-text model.
model = "gemini-3.5-transcribe"
# 0 turns thinking off; -1 omits thinkingConfig for models that reject it.
thinking_budget = -1

[engines.deepgram]
# Nova-3 Portuguese codes: pt, pt-BR, pt-PT.
language = "pt-PT"
# Vocabulary hints through keyterm prompting.
keyterm = true

# Optional: engines left out by a recorded decision. They are reported as
# SKIPPED with this reason (1-120 printable ASCII characters).
# [engines.skip]
# "deepgram-nova-3" = "not run by Sponsor decision"
