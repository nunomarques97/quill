# Quill configuration example. Every value here is invented.
#
# Copy the lines you want to change to local/quill.toml (ignored by Git):
# that file is read over this one, table by table, so it only needs the
# values that differ. Check a file with:
#   py -3.12 -m quill.config --check local/quill.toml

# Push-to-talk triggers: hold to talk, release to stop.
# Mouse buttons: "xbutton1" (back), "xbutton2" (forward), "middle".
# Keys: "f1" to "f24", "right_ctrl", "right_alt", "right_shift", "pause",
# "scroll_lock", "insert", "apps". F13 to F24 suit a Stream Deck style
# button. An input can belong to one trigger only. An input bound in
# local/quill.toml is taken off the triggers of this example, so a local
# binding always wins; two triggers of local/quill.toml bound to one input are
# an error.
#
# Mouse 4 (xbutton1) dictates: the text is typed and nothing is sent.
[triggers.dictation]
buttons = ["xbutton1"]
keys = ["f13", "right_ctrl"]

# Hold with text selected and speak an instruction to rewrite the selection
# ("põe isto mais formal", "traduz para inglês", "encurta"). The command
# trigger never clicks, so the selection is kept. On release the selection is
# copied (the clipboard is put back), rewritten by the local [ollama] model and
# typed over the selection. Terminals are refused. Empty lists disable it.
[triggers.command]
buttons = []
keys = ["f14"]

# Send to Claude Code. Both triggers click where the pointer is, like a
# dictation, type the whole text and then press one plain Enter, but only when
# the target is Claude Code: the claude-code profile below (the Windows
# Terminal Claude Code title, or VS Code ending with the " [Claude Code]"
# marker). Anywhere else (a file in VS Code, its integrated terminal, a
# browser, WhatsApp, ...) the text is typed without Enter and the indicator
# says "Não é o Claude Code: escrito sem Enter".
#
# Mouse 5 (xbutton2): every dictation goes through the local [ollama] model
# first, whatever its length and whatever [autorewrite] enabled, min_audio_s
# and min_words say, with the same content guard; a refusal, an Ollama failure
# or a timeout types the original text with a short notice. The indicator
# shows "A rever o texto" while the model works. Into Claude Code the model
# also gets the context pack of the window's project ([project_context]
# below) and then enriches the corrected text into a structured prompt (see
# [autorewrite]); the indicator shows "A enriquecer o prompt para o Claude
# Code…" meanwhile and "Prompt enriquecido e enviado" after the Enter. In
# the Claude Code panel of VS Code the prompt parts go on separate lines
# (Shift+Enter); in a terminal they stay one paragraph with their labels.
[triggers.send_polished]
buttons = ["xbutton2"]
keys = ["f15"]

# Middle click: the dictation is sent as it was recognized, never rewritten
# by the model, however long.
[triggers.send_raw]
buttons = ["middle"]
keys = []

# Older send trigger, kept so existing local files still load: Enter only in
# Claude Code, and the model rewrites only a long dictation (as [autorewrite]
# says). Empty here: use send_polished or send_raw instead.
[triggers.send_claude]
buttons = []
keys = []

# Voice commands: hold, say the command, release. Today there is one command:
# "abre VS Code no <projeto>" (also "abre o VS Code na <projeto>" or "abrir VS
# Code em <projeto>") opens that project's Windows shortcut from the folders
# of [voice_commands] below. The voice trigger never clicks, never types and
# never presses Enter. It takes at most one key and no mouse button (mouse 4
# stays for dictation); keys = [] disables it. While Quill runs the key is
# swallowed: F9 no longer reaches other programs (for example VS Code
# breakpoints), so bind another key in local/quill.toml if you need F9.
[triggers.voice]
buttons = []
keys = ["f9"]

[input]
# A shorter hold is a tap: it is ignored and nothing is clicked or typed.
min_hold_ms = 250
# Click at the pointer when a dictation hold starts, to focus the field under it.
click_to_focus = true

[audio]
# MME input device name (MME truncates names to 31 characters; a prefix matches).
microphone = "Headset Microphone (Example Headset)"

[engine]
# Local Whisper model, read from models/ (never downloaded).
# "large-v3-turbo" (default): the final text about half a second after release.
# "large-v3" (precise mode): slower release, better on short commands and
# English terms.
model = "large-v3-turbo"

[indicator]
# "pointer" (beside the mouse pointer) or "bottom-center".
position = "pointer"

[ollama]
# Local Ollama only: the address must be loopback.
url = "http://127.0.0.1:11434"
model = "qwen3:8b"

[cleanup]
# "rules" (deterministic, default) or "llm" (local Ollama model, falls back to
# the rules on any failure). "llm" is off by default: on the real dictation set
# it deleted content words and added about 1 s at p95 (docs/research/FASE2.md).
mode = "rules"

# Learning from corrections (learned replacements live in paths.corrections).
# Select the corrected text of the last dictation and press the correction
# key; "" disables it. The key is not swallowed and may not be a trigger key.
# Manual edits (typing, Backspace, Delete, arrows) of the typed text are
# followed for edit_window_s seconds; a click, paste, undo or other window
# stops following them. A replacement seen in two dictations is applied
# automatically; review them with: py -3.12 -m quill.review
[corrections]
key = "f16"
edit_window_s = 30

# Automatic rewrite of long dictations. A dictation with more than min_audio_s
# seconds of audio or more than min_words words is checked by the local
# [ollama] model before it is typed: misheard words are fixed from the context
# (window profile, project, personal vocabulary) and, in Claude Code, the text
# is laid out as a clear prompt. A deterministic guard refuses any reply that
# drops or adds information; a refusal, an Ollama failure or a reply slower
# than timeout_s types the original text. Shorter dictations never call the
# model. On by default since its measurement on the real dictation set (no
# content word lost, clean WER not worse): see docs/research/FASE2.md.
# The indicator shows "A rever o texto" while the model works. In the Claude
# Code panel of VS Code a rewrite may use several lines (typed as Shift+Enter);
# in a terminal it stays one paragraph, because a terminal may take Shift+Enter
# as Enter.
# In Claude Code, mouse 5 (send_polished) then asks the model a second time
# to turn the corrected text into a structured prompt (Objetivo, Contexto,
# Pedido, Restrições, Critérios de aceitação), in the dictation's language. A
# second guard refuses any reply that loses a dictated word or number, adds a
# number, or adds a word that is neither dictated, from the project's context
# pack nor a part label; project context may appear only in the Contexto part.
# A refusal, an Ollama failure or a reply slower than enrich_timeout_s seconds
# (1-60) types the corrected text, and after the Enter the indicator says
# "Enriquecimento recusado; foi o texto corrigido", "Ollama indisponível; foi
# o texto corrigido" or "O enriquecimento demorou demais; foi o texto
# corrigido". A short dictation (under 6 words) is corrected but not
# enriched. Mouse 4, the middle click, send_claude and every window other
# than Claude Code keep the rewrite described above, without pack or
# enrichment.
# undo_key puts the original text back in place of the last rewrite, for
# undo_window_s seconds, only in the same window, before Enter, and while the
# rewritten text is untouched with the cursor at its end (it needs the manual
# edit tracking of [corrections]); otherwise it changes nothing and the
# indicator says why. The key is not swallowed; it may not be a trigger key or
# the correction key; "" disables it.
[autorewrite]
enabled = true
min_audio_s = 15
min_words = 40
timeout_s = 4
enrich_timeout_s = 15
undo_key = "f17"
undo_window_s = 30

# Alert when Claude Code (the VS Code panel or the terminal) finishes its reply
# and waits for you, or asks for a permission: a short sound and the indicator
# state "Claude Code terminou" or "Claude Code pede permissão", with the
# project ("<projeto>: Claude acabou"). It needs the Claude Code hooks, added
# only by the manual command (it shows the exact change and asks before
# writing):
#   py -3.12 -m quill.claude_hooks --install
# While a dictation or a command is recording, the alert waits until that
# session ends, so the sound never reaches the microphone; alerts close
# together ring once. filter chooses which Claude Code sessions ring:
#   "attended" (default): only sessions someone is using (Claude Code marks
#     them); claude -p, the Agent SDK and automated runs never ring;
#   "unless-headless": also a Claude Code that does not mark its sessions;
#   "all": every session, headless ones too.
# speak_project: after the sound, a voice Windows already has says the
# project names (a Portuguese voice when Windows has one; at most three,
# permission requests first). A dictation that starts stops it at once.
# speech_volume: 0 to 100. speech_rate: 0.5 to 6.0 (1.0 is normal speed).
# With sound = false nothing is spoken either. Hear an example with
#   py -3.12 -m quill.sound --play-sound --speak
[claude_alert]
enabled = true
sound = true
filter = "attended"
speak_project = true
speech_volume = 80
speech_rate = 1.0

# Folders with one Windows shortcut (.lnk) per project, for the voice command
# "abre VS Code no <projeto>". Empty here: list absolute folder paths only in
# the ignored local/quill.toml, for example
#   shortcut_dirs = ['D:\Projects\Hub\Main', 'D:\Projects\Hub\Other']
# Each folder is read without its subfolders and only .lnk files count; the
# file name (without .lnk) is the project name. A missing folder is skipped.
# The spoken name is matched with the personal vocabulary (a name or one of
# its variants) and a small spelling tolerance, ignoring case, accents, spaces
# and hyphens. An exact name wins over a longer one ("alfa" opens alfa, "alfa
# public" opens alfa-public). The indicator then shows "A abrir <nome>". When
# no single project is clearly meant, nothing opens and the indicator shows up
# to 3 close names ("Parecidos: ..."). A shortcut that starts VS Code is
# opened as a double click would; a shortcut to a folder opens that folder in
# VS Code; any other shortcut is refused.
# model decodes the voice trigger's holds only (dictation keeps [engine]
# model). "large-v3" (default) recognised the spoken project names clearly
# better than "large-v3-turbo" in the voice-command measurement
# (docs/research/VOICE-COMMANDS.md), about 0.1 s slower. When it differs
# from [engine] model, Quill keeps both models loaded (about 3 GB more video
# memory); until it is ready, or if it cannot load, the voice trigger uses
# the [engine] model.
[voice_commands]
shortcut_dirs = []
model = "large-v3"

# The project of the Claude Code or VS Code window a dictation goes to
# (quill.projects). Quill reads the project name from the window title (a
# project hub title "<projeto> | <ficheiro> - Visual Studio Code [<vista>]",
# or the folder part of VS Code's standard title), or, for Claude Code in a
# terminal, from the folder the single Claude Code session of that window
# runs in (its nearest Git root). The name leads to the project folder
# through folders below first, then through the targets of the
# [voice_commands] shortcuts (a folder, or a VS Code shortcut to a folder or
# a .code-workspace file). Names compare ignoring case, accents and
# punctuation. An unknown project keeps the hint from the window title.
# folders maps a project name to its absolute local folder. Project names
# and folders are personal: set them only in local/quill.toml, for example
#   [project_context.folders]
#   "nome-do-projeto" = 'D:\pasta\do\projeto'
# Here it stays empty.
# From a project folder that is a Git work tree, Quill builds a context pack
# (quill.context_pack), locally and read-only: a short summary of what the
# project is (from its CLAUDE.md, else its README.md) and a list of its own
# terms (headings and inline code of README, CLAUDE.md and docs/, module,
# file and class names, and words the project repeats). Only files Git
# tracks or would track are read: nothing the project's .gitignore excludes,
# and never .env files, keys, certificates, credential, token or secret
# files, audio or video, recordings/, local/ or .git/, nor anything behind a
# link that leaves the folder. Size and file-count limits apply; nothing
# leaves the PC and project content is never logged.
# cache is the folder of the cached packs (one JSON file per project,
# inside the ignored local/ folder only). A pack is built again when a file
# it read changes, the file list changes, or it is older than max_age_h
# hours (1-720). A build that takes longer than build_timeout_s seconds
# (0.5-30) gives no pack, and the dictation goes on without it. Only mouse 5
# (send_polished) into Claude Code uses the pack, and only when it is bound;
# without a known project, mouse 5 corrects and enriches without one. Count the
# pack of each configured project (counts only) with:
#   py -3.12 -m quill.context_pack --check
[project_context]
folders = {}
cache = "local/context"
max_age_h = 24
build_timeout_s = 5.0

# Personal data. Paths are relative to the repository and must stay inside
# the ignored local/ folder. style is a folder of writing samples:
# <profile>.txt (for example whatsapp.txt), or default.txt for every profile
# without its own file, with samples separated by a blank line. They are
# added to the local model's prompt only when [cleanup] mode = "llm"; with
# the rules cleanup the profile rules below are the style. Count them with:
#   py -3.12 -m quill.profiles --check
[paths]
vocabulary = "local/vocabulary.toml"
corrections = "local/corrections.json"
style = "local/style"

# Active-window profiles, checked in this order; the first match wins and a
# window that matches none uses the default profile. Profile names:
# "claude-code", "vscode", "whatsapp", "email". Within a profile every listed
# field must match; a field matches when any entry does. processes and
# classes compare whole names, titles compare substrings (both ignore case);
# a title entry in square brackets, such as "[Claude Code]", matches only at
# the end of the title.
# A profile written [[profiles.<name>]] (repeated) has alternatives: the
# window gets the profile when any alternative matches.
# A profile in local/quill.toml replaces the profile of the same name here,
# with all its alternatives.
# A process that cannot be read (an elevated window) matches no process list.
#
# Each profile shapes the final text; words are never changed:
#   claude-code, vscode: technical prompt style, always a final period;
#   whatsapp: informal, no final period;
#   email: full sentences, a comma after an opening greeting ("Bom dia, ...");
#   any other window (default): a final period, as the cleanup gives.
#
# claude-code is also what the send triggers check before pressing Enter, so
# it comes first and matches only a window that is Claude Code:
# - Windows Terminal with "Claude Code" in the title;
# - VS Code with the marker "[Claude Code]" right after the last "Visual
#   Studio Code" of the title. A title entry written in square brackets
#   matches only at the end of the title, after a space; in VS Code it is the
#   focused view after the app name, optionally followed by the " - <editor
#   state>" suffix VS Code adds with editor.accessibilitySupport "on" (for
#   example " - Modified"), so a file named "[Claude Code].md" does not
#   count. VS Code shows the marker only when its window.title setting has
#   " [${focusedView}]" after ${appName} and the Claude Code view in the
#   sidebar has the focus. Check a window with
#   py -3.12 -m quill.profiles --probe --delay 5
#   A Claude Code editor tab, the integrated terminal, a file or any other
#   view gets the vscode profile: the text is typed without Enter.
[[profiles.claude-code]]
processes = ["WindowsTerminal.exe"]
titles = ["Claude Code"]

[[profiles.claude-code]]
processes = ["Code.exe"]
titles = ["[Claude Code]"]

[profiles.vscode]
processes = ["Code.exe"]

[profiles.whatsapp]
processes = ["WhatsApp.exe"]

[profiles.email]
processes = ["olk.exe", "OUTLOOK.EXE"]
